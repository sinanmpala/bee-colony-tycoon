<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bee Colony Tycoon</title>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topBar">

    <div class="topCard">
      <div class="topLabel">💰 Money</div>
      <div id="moneyText">$0</div>
    </div>

    <div class="topCard">
      <div class="topLabel">🍯 Honey</div>
      <div id="honeyText">0</div>
    </div>

    <div class="topCard levelCard">
      <div class="topLabel">LEVEL</div>
      <div id="levelText">1</div>

      <div class="xpBar">
        <div id="xpFill"></div>
      </div>
    </div>

  </div>



  <!-- FACTORY AREA -->
  <div class="factoryArea">

    <!-- LEFT PIPE -->
    <div class="leftPipe">

      <div class="pipeGlow"></div>

      <div class="pipeIcon">🐝</div>
      <div class="pipeIcon">🍯</div>
      <div class="pipeIcon">👑</div>
      <div class="pipeIcon">💎</div>

    </div>



    <!-- MAIN FACTORY -->
    <div class="factoryMain">

      <!-- MACHINE -->
      <div class="machineSection">

        <div class="machineBox">

          <div class="machineTop"></div>

          <div class="machineFront">
            <div class="honeyDrop">🍯</div>
          </div>

        </div>

        <div class="conveyor">

          <div class="jar"></div>
          <div class="jar"></div>
          <div class="jar"></div>
          <div class="jar"></div>
          <div class="jar"></div>

        </div>

      </div>



      <!-- STAGES -->
      <div id="stagesContainer">

      </div>

    </div>

  </div>



  <!-- BOTTOM NAV -->
  <div class="bottomNav">

    <button class="navBtn active">
      🏭
      <span>Factory</span>
    </button>

    <button class="navBtn">
      🐝
      <span>Bees</span>
    </button>

    <button class="navBtn">
      ⚡
      <span>Boosters</span>
    </button>

    <button class="navBtn">
      🛒
      <span>Shop</span>
    </button>

  </div>



  <!-- FLOATING BEES -->
  <div id="beeParticles"></div>

  <script src="script.js"></script>

</body>
</html>
