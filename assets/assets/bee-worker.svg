<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210">
  <defs>
    <radialGradient id="abdomenGold" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="35%" stop-color="#e9a91b"/>
      <stop offset="70%" stop-color="#9d5b08"/>
      <stop offset="100%" stop-color="#3a2104"/>
    </radialGradient>

    <radialGradient id="headGold" cx="34%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#ffe89a"/>
      <stop offset="50%" stop-color="#d99012"/>
      <stop offset="100%" stop-color="#583003"/>
    </radialGradient>

    <linearGradient id="stripe" x1="0" x2="1">
      <stop offset="0%" stop-color="#120b03"/>
      <stop offset="45%" stop-color="#2b1603"/>
      <stop offset="100%" stop-color="#050200"/>
    </linearGradient>

    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#dff7ff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#8cc9dd" stop-opacity="0.42"/>
    </linearGradient>

    <radialGradient id="eye" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#000000" flood-opacity="0.33"/>
    </filter>

    <filter id="innerTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- rear wing -->
    <path d="M122 53
             C92 12, 37 23, 43 75
             C49 118, 111 108, 139 75
             C146 66, 140 58, 122 53Z"
          fill="url(#wing)"
          stroke="#6a9db0"
          stroke-width="4"
          opacity="0.88"/>

    <!-- front wing -->
    <path d="M169 48
             C139 2, 77 16, 84 72
             C90 123, 160 112, 190 73
             C199 61, 190 51, 169 48Z"
          fill="url(#wing)"
          stroke="#5e95ad"
          stroke-width="4"
          opacity="0.92"/>

    <!-- wing veins -->
    <path d="M92 70 C112 60 132 61 157 74" fill="none" stroke="#7fb2c5" stroke-width="2" opacity="0.55"/>
    <path d="M75 78 C93 83 111 88 134 86" fill="none" stroke="#7fb2c5" stroke-width="2" opacity="0.45"/>
    <path d="M128 50 C140 66 151 82 166 101" fill="none" stroke="#7fb2c5" stroke-width="2" opacity="0.45"/>

    <!-- abdomen -->
    <path d="M46 119
             C54 73, 94 51, 145 59
             C191 66, 223 92, 220 127
             C217 162, 179 183, 127 179
             C76 175, 39 156, 46 119Z"
          fill="url(#abdomenGold)"
          stroke="#2a1703"
          stroke-width="7"/>

    <!-- stripes wrapped over abdomen -->
    <path d="M83 66 C67 94 64 137 82 170"
          fill="none" stroke="url(#stripe)" stroke-width="16" stroke-linecap="round" opacity="0.95"/>
    <path d="M121 59 C104 91 103 143 124 177"
          fill="none" stroke="url(#stripe)" stroke-width="17" stroke-linecap="round" opacity="0.95"/>
    <path d="M160 68 C143 99 143 144 163 171"
          fill="none" stroke="url(#stripe)" stroke-width="15" stroke-linecap="round" opacity="0.92"/>

    <!-- abdomen texture highlight -->
    <path d="M63 103
             C85 76, 135 70, 179 84
             C151 86, 104 92, 65 124Z"
          fill="#fff4b8"
          opacity="0.18"/>

    <!-- stinger -->
    <path d="M48 121 L14 100 L25 140 Z"
          fill="#1c1103"
          stroke="#090501"
          stroke-width="4"/>

    <!-- head -->
    <circle cx="225" cy="112" r="41"
            fill="url(#headGold)"
            stroke="#2a1703"
            stroke-width="7"/>

    <!-- face highlight -->
    <ellipse cx="210" cy="96" rx="14" ry="10" fill="#fff0a8" opacity="0.35"/>

    <!-- eye -->
    <circle cx="238" cy="102" r="8" fill="url(#eye)"/>
    <circle cx="235" cy="98" r="2.5" fill="#ffffff" opacity="0.9"/>

    <!-- mouth -->
    <path d="M247 127 C260 135 273 128 277 116"
          fill="none"
          stroke="#2a1703"
          stroke-width="5"
          stroke-linecap="round"/>

    <!-- antennae -->
    <path d="M213 75 C198 43 184 29 168 20"
          fill="none"
          stroke="#2a1703"
          stroke-width="6"
          stroke-linecap="round"/>
    <path d="M239 76 C251 43 266 27 284 17"
          fill="none"
          stroke="#2a1703"
          stroke-width="6"
          stroke-linecap="round"/>
    <circle cx="165" cy="18" r="8" fill="#2a1703"/>
    <circle cx="287" cy="15" r="8" fill="#2a1703"/>

    <!-- legs -->
    <path d="M100 162 C83 179 79 195 77 203" fill="none" stroke="#221303" stroke-width="7" stroke-linecap="round"/>
    <path d="M145 166 C137 185 139 199 143 207" fill="none" stroke="#221303" stroke-width="7" stroke-linecap="round"/>
    <path d="M184 154 C198 171 209 184 217 194" fill="none" stroke="#221303" stroke-width="7" stroke-linecap="round"/>

    <!-- tiny fuzz marks -->
    <path d="M64 88 l-14 -10" stroke="#3b2407" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M72 156 l-15 9" stroke="#3b2407" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M194 82 l12 -11" stroke="#3b2407" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M206 151 l16 7" stroke="#3b2407" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
